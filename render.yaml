# Render Blueprint: New > Blueprint in the Render dashboard, then pick this repo.
# You'll be asked for the keys marked sync: false. Never commit them.
services:
  - type: web
    name: week1-job-extractor
    runtime: docker
    plan: free
    dockerfilePath: ./week1-llm-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDERS
        value: groq,gemini   # Groq first: faster and steadier on free tiers. No Ollama on Render (laptop only)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "20"

  - type: web
    name: grant-finder
    runtime: docker
    plan: free
    dockerfilePath: ./grants-finder/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDERS
        value: groq,gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MAX_CANDIDATES
        value: "10"

  - type: web
    name: pitch-perfect
    runtime: docker
    plan: free
    dockerfilePath: ./pitch-perfect/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDERS
        value: groq,gemini
      # Reuse the keys already set on grant-finder, so they're entered once.
      - key: GROQ_API_KEY
        fromService:
          type: web
          name: grant-finder
          envVarKey: GROQ_API_KEY
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: grant-finder
          envVarKey: GEMINI_API_KEY

  - type: web
    name: deal-desk
    runtime: docker
    plan: free
    dockerfilePath: ./deal-desk/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDERS
        value: groq,gemini
      - key: ALLOWED_ORIGINS
        value: "*"   # set to One Click's domains for production
      - key: PAYWALL_SECRET
        generateValue: true   # signs deal passes; keeps them valid across restarts
      - key: GROQ_API_KEY
        fromService:
          type: web
          name: grant-finder
          envVarKey: GROQ_API_KEY
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: grant-finder
          envVarKey: GEMINI_API_KEY
