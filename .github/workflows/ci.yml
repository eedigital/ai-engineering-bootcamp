name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r week1-llm-service/requirements.txt -r grants-finder/requirements.txt pytest
      # Both apps. Tests fake the AI and Grants.gov: no keys, no network.
      - run: pytest -q
