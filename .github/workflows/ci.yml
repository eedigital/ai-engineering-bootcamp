name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r week1-llm-service/requirements.txt -r grants-finder/requirements.txt -r pitch-perfect/requirements.txt -r deal-desk/requirements.txt -r experiment-agent/requirements.txt -r growth-lab/requirements.txt -r prompt-lab/requirements.txt reportlab pytest
      # Every app. Tests fake the AI and outside services: no keys, no network.
      - run: pytest -q
