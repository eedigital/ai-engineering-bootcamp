name: ci

on:
  push:
  pull_request:

jobs:
  week1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r week1-llm-service/requirements.txt pytest
      # Tests use the fake provider: no API keys, no quota used.
      - run: pytest -q
